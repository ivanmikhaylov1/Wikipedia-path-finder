name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /
      - run: npm run measure:bundle
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - run: npm run test:local
      - run: rm -f public/graphs/en.bin.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            playwright-report
            test-results
            lighthouse-reports
